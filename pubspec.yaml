name: mutual_transfer
description: NearLink local network file and message transfer for Windows and Android.
publish_to: none
version: 0.3.2+17

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  desktop_drop: 0.8.4
  file_picker: 11.0.2
  lucide_icons_flutter: ^4.0.2
  launch_at_startup: 0.5.1
  flutter_local_notifications_windows:
    path: third_party/flutter_local_notifications_windows
  path: ^1.9.1
  tray_manager: 0.5.3
  window_manager: 0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/app-icon.png
    - windows/runner/resources/app_icon.ico
